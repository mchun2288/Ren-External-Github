<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo App</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      padding: 1rem;
      background: #f4f5f7;
    }
    main {
      max-width: 480px;
      margin: 2rem auto;
      padding: 1.5rem;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15);
    }
    h1 {
      margin-top: 0;
    }
    .todo-form {
      display: flex;
      gap: 0.5rem;
    }
    .todo-form input {
      flex: 1;
      padding: 0.5rem;
      font-size: 1rem;
    }
    .todo-form button {
      padding: 0.5rem 1rem;
      font-size: 1rem;
      cursor: pointer;
    }
    #todoList {
      padding-left: 1.25rem;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Todo App</h1>
    </header>

    <section aria-label="Add a todo">
      <div class="todo-form">
        <input type="text" id="todoInput" placeholder="What needs to be done?" aria-label="New todo">
        <button type="button" id="addBtn">Add</button>
      </div>
    </section>

    <section aria-label="Todo list">
      <ul id="todoList"></ul>
    </section>
  </main>

  <script>
    const input = document.getElementById('todoInput');
    const addBtn = document.getElementById('addBtn');
    const list = document.getElementById('todoList');

    function addTodo() {
      const text = input.value.trim();
      if (!text) return;

      const li = document.createElement('li');
      li.textContent = text;
      list.appendChild(li);

      input.value = '';
      input.focus();
    }

    addBtn.addEventListener('click', addTodo);
    input.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') addTodo();
    });
  </script>
</body>
</html>
